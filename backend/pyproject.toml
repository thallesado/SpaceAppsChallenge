[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lunarpath-backend"
version = "0.1.0"
description = "LunarPath AI scientific API"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.118,<1", "httpx>=0.27,<1", "uvicorn>=0.30,<1", "rasterio>=1.4,<2", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
validation = ["spiceypy>=8,<9"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
